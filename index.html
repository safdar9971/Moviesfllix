<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextora Movies - Watch Free Movies Online</title>
    <!-- Tailwind CSS for Modern Netflix-style styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #E50914; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#141414] text-white font-sans antialiased">

    <!-- Navbar -->
    <nav class="flex items-center justify-between px-6 py-4 bg-black/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="text-2xl font-bold tracking-wider text-[#E50914]">NEXTORA MOVIES</div>
        <div class="hidden md:flex space-x-6 text-sm font-medium text-gray-300">
            <a href="#" class="hover:text-white transition">Home</a>
            <a href="#" class="hover:text-white transition">Movies</a>
            <a href="#" class="hover:text-white transition">Web Series</a>
        </div>
        <button class="bg-[#E50914] text-white px-4 py-1.5 rounded text-sm font-medium hover:bg-red-700 transition">Sign In</button>
    </nav>

    <!-- Hero Banner & Search Section -->
    <div class="relative h-[65vh] w-full flex items-center justify-center bg-cover bg-center" style="background-image: linear-gradient(to bottom, rgba(20,20,20,0.3), rgba(20,20,20,1)), u
<!-- Movies Section -->
    <div class="px-6 md:px-12 py-8">
        <h2 id="sectionTitle" class="text-xl md:text-2xl font-semibold mb-6 border-l-4 border-[#E50914] pl-3">Trending Now</h2>
        
        <!-- Movies Grid Container -->
        <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <!-- Movies dynamically loaded via JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-gray-800 bg-black/40 py-6 text-center text-xs text-gray-500 mt-12">
        <p>&copy; 2026 Nextora Movies. All rights reserved.</p>
    </footer>
<script>
        // Movie Database Array
        const moviesDatabase = [
            { title: "Inception", genre: "Sci-Fi / Action", image: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=300&q=80", watchUrl: "#" },
            { title: "The Dark Knight", genre: "Action / Drama", image: "https://images.unsplash.com/photo-1478720143033-6a972678da30?auto=format&fit=crop&w=300&q=80", watchUrl: "#" },
            { title: "Interstellar", genre: "Sci-Fi / Adventure", image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=300&q=80", watchUrl: "#" },
            { title: "Avatar: Water", genre: "Sci-Fi / Fantasy", image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=300&q=80", watchUrl: "#" },
            { title: "Spirited Away", genre: "Animation / Anime", image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=300&q=80", watchUrl: "#" },
            { title: "Gladiator", genre: "Action / History", image: "https://images.unsplash.com/photo-1559583985-c80d8ad9b29f?auto=format&fit=crop&w=300&q=80", watchUrl: "#" }
        ];

        const moviesGrid = document.getElementById('moviesGrid');
        const movieSearch = document.getElementById('movieSearch');
        const sectionTitle = document.getElementById('sectionTitle');

        function displayMovies(moviesList) {
            moviesGrid.innerHTML = ""; 
            if (moviesList.length === 0) {
                moviesGrid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No movies found.</p>`;
                return;
            }
            moviesList.forEach(movie => {
                moviesGrid.innerHTML += `
                    <div class="group relative bg-[#181818] rounded-md overflow-hidden shadow-md hover:scale-105 transition duration-300 cursor-pointer">
                        <img src="${movie.image}" alt="${movie.title}" class="w-full h-64 object-cover">
                        <div class="p-3">
                            <h3 class="font-bold text-sm truncate group-hover:text-[#E50914] transition">${movie.title}</h3>
                            <p class="text-xs text-gray-400 mt-1">${movie.genre}</p>
                            <a href="${movie.watchUrl}" class="inline-block w-full text-center bg-[#E50914] text-white text-xs font-semibold py-1.5 mt-3 rounded hover:bg-red-700 transition">Watch Now</a>
                        </div>
                    </div>`;
            });
        }

        movieSearch.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = moviesDatabase.filter(m => m.title.toLowerCase().includes(searchTerm) || m.genre.toLowerCase().includes(searchTerm));
            sectionTitle.innerText = searchTerm !== "" ? `Search Results for: "${e.target.value}"` : "Trending Now";
            displayMovies(filtered);
        });

        displayMovies(moviesDatabase);
    </script>
</body>
</html>
